name: Aggiorna snapshot Giornale

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentiero-giornale-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Raccogli fonti e valida l'edizione
        run: node tools/build-news-snapshot.mjs
      - name: Pubblica soltanto uno snapshot valido e cambiato
        run: |
          if git diff --quiet -- assets/giornale/latest.json; then exit 0; fi
          git config user.name "sentiero-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/giornale/latest.json
          git commit -m "chore(giornale): aggiorna snapshot editoriale"
          git push
