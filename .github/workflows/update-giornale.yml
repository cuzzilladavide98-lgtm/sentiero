name: Aggiorna snapshot Giornale

on:
  push:
    paths:
      - '.github/workflows/update-giornale.yml'
      - 'tools/build-news-snapshot.mjs'
      - 'build-news-snapshot.mjs'
      - 'sentiero-day.mjs'
      - 'sync-worker/src/index.js'
      - 'sync-worker/src/news-sources.js'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentiero-giornale-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Raccogli fonti e valida l'edizione
        run: if [ -f tools/build-news-snapshot.mjs ]; then node tools/build-news-snapshot.mjs; else node build-news-snapshot.mjs; fi
      - name: Pubblica soltanto uno snapshot valido e cambiato
        run: |
          if [ -z "$(git status --porcelain -- assets/giornale/latest.json latest.json)" ]; then exit 0; fi
          git config user.name "sentiero-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/giornale/latest.json latest.json
          git commit -m "chore(giornale): aggiorna snapshot editoriale"
          git push
